[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
yesman-core = { path = "crates/yesman-core" }
yesman-model = { path = "crates/yesman-model" }

anyhow = "1"
async-stream = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
half = { version = "2", features = ["std"] }
memmap2 = "0.9"
rand = "0.8"
rayon = "1"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
